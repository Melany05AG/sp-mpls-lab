frr version 10.2.1
frr defaults traditional
hostname ce-a1
log syslog informational
service integrated-vtysh-config
!
! Cliente A, sitio 1: router-on-a-stick para VLAN 10 y 20 (subinterfaces en setup.sh)
interface eth1
 description WAN -> PE1 (CUST-A)
 ip address 172.16.1.2/30
 no ip ospf passive
exit
!
router ospf
 ospf router-id 10.10.255.1
 passive-interface default
 network 172.16.1.0/30 area 0
 network 10.10.10.0/24 area 0
 network 10.10.20.0/24 area 0
exit
!
end
