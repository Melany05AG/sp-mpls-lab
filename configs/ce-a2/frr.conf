frr version 10.2.1
frr defaults traditional
hostname ce-a2
log syslog informational
service integrated-vtysh-config
!
! Cliente A, sitio 2
interface eth1
 description WAN -> PE3 (CUST-A)
 ip address 172.16.1.6/30
 no ip ospf passive
exit
!
interface eth2
 description LAN sitio 2
 ip address 10.10.30.1/24
exit
!
router ospf
 ospf router-id 10.10.255.2
 passive-interface default
 network 172.16.1.4/30 area 0
 network 10.10.30.0/24 area 0
exit
!
end
