frr version 10.2.1
frr defaults traditional
hostname pe3
log syslog informational
service integrated-vtysh-config
!
! ---------- Loopback (router-id, sesiones iBGP, transporte LDP) ----------
interface lo
 ip address 10.255.0.13/32
 ipv6 address 2001:db8:ffff::13/128
 ip router isis CORE
 ipv6 router isis CORE
 isis passive
exit
!
interface eth1
 description CORE -> P1
 ip address 10.0.0.10/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
interface eth2
 description CORE -> P2
 ip address 10.0.0.12/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
! ---------- IGP: IS-IS L2, dual-stack (multi-topology IPv6) ----------
router isis CORE
 net 49.0001.0102.5500.0013.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
 log-adjacency-changes
exit
!
! ---------- MPLS: LDP sobre todos los enlaces del nucleo ----------
mpls ldp
 router-id 10.255.0.13
 !
 address-family ipv4
  discovery transport-address 10.255.0.13
  label local allocate host-routes
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
 exit-address-family
 !
exit
!
! Nota: las interfaces de cliente (eth3/eth4) se asocian a su VRF y se
! direccionan en setup.sh, porque al mover una interfaz a una VRF el kernel
! limpia sus direcciones.
!
! ---------- BGP global: sesion iBGP al route reflector ----------
router bgp 65000
 bgp router-id 10.255.0.13
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.1 description RR-P1
 !
 address-family ipv4 vpn
  neighbor 10.255.0.1 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 10.255.0.1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.255.0.1 activate
  advertise-all-vni
 exit-address-family
exit
!
! ---------- L3VPN CUST-A (PE-CE: OSPF) ----------
router ospf vrf CUST-A
 ospf router-id 10.255.0.13
 redistribute bgp
 network 172.16.1.0/29 area 0
exit
!
router bgp 65000 vrf CUST-A
 bgp router-id 10.255.0.13
 !
 address-family ipv4 unicast
  redistribute ospf
  redistribute connected
  label vpn export auto
  rd vpn export 65000:103
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
exit
!
end
