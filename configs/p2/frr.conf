frr version 10.2.1
frr defaults traditional
hostname p2
log syslog informational
service integrated-vtysh-config
!
! ---------- Loopback (router-id, sesiones iBGP, transporte LDP) ----------
interface lo
 ip address 10.255.0.2/32
 ipv6 address 2001:db8:ffff::2/128
 ip router isis CORE
 ipv6 router isis CORE
 isis passive
exit
!
interface eth1
 description CORE -> P1
 ip address 10.0.0.1/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
interface eth2
 description CORE -> PE1
 ip address 10.0.0.5/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
interface eth3
 description CORE -> PE2
 ip address 10.0.0.9/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
interface eth4
 description CORE -> PE3
 ip address 10.0.0.13/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
! ---------- IGP: IS-IS L2, dual-stack (multi-topology IPv6) ----------
router isis CORE
 net 49.0001.0102.5500.0002.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
 log-adjacency-changes
exit
!
! ---------- MPLS: LDP sobre todos los enlaces del nucleo ----------
mpls ldp
 router-id 10.255.0.2
 !
 address-family ipv4
  discovery transport-address 10.255.0.2
  label local allocate host-routes
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
  interface eth3
  exit
  !
  interface eth4
  exit
  !
 exit-address-family
 !
exit
!
end
