frr version 10.2.1
frr defaults traditional
hostname pe2
log syslog informational
service integrated-vtysh-config
!
! ---------- Loopback (router-id, sesiones iBGP, transporte LDP) ----------
interface lo
 ip address 10.255.0.12/32
 ipv6 address 2001:db8:ffff::12/128
 ip router isis CORE
 ipv6 router isis CORE
 isis passive
exit
!
interface eth1
 description CORE -> P1
 ip address 10.0.0.6/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
interface eth2
 description CORE -> P2
 ip address 10.0.0.8/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
! ---------- IGP: IS-IS L2, dual-stack (multi-topology IPv6) ----------
router isis CORE
 net 49.0001.0102.5500.0012.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
 log-adjacency-changes
exit
!
! ---------- MPLS: LDP sobre todos los enlaces del nucleo ----------
mpls ldp
 router-id 10.255.0.12
 !
 address-family ipv4
  discovery transport-address 10.255.0.12
  label local allocate host-routes
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
 exit-address-family
 !
exit
!
! Nota: las interfaces de cliente (eth3/eth4) se asocian a su VRF y se
! direccionan en setup.sh, porque al mover una interfaz a una VRF el kernel
! limpia sus direcciones.
!
! ---------- BGP global: sesion iBGP al route reflector ----------
router bgp 65000
 bgp router-id 10.255.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.1 description RR-P1
 !
 address-family ipv4 vpn
  neighbor 10.255.0.1 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 10.255.0.1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.255.0.1 activate
  advertise-all-vni
 exit-address-family
exit
!
! ---------- L3VPN CUST-B (PE-CE: eBGP dual-stack / BGP4+) ----------
ip prefix-list PL-CUSTB-S2-V4 seq 10 permit 198.51.100.0/24 le 32
ipv6 prefix-list PL-CUSTB-S2-V6 seq 10 permit 2001:db8:b0::/44 le 64
!
route-map RM-CUSTB-IN-V4 permit 10
 match ip address prefix-list PL-CUSTB-S2-V4
exit
!
route-map RM-CUSTB-IN-V6 permit 10
 match ipv6 address prefix-list PL-CUSTB-S2-V6
exit
!
route-map RM-PERMIT-ALL permit 10
exit
!
router bgp 65000 vrf CUST-B
 bgp router-id 10.255.0.12
 no bgp default ipv4-unicast
 neighbor 172.16.2.6 remote-as 65002
 neighbor 172.16.2.6 description CE-B-S2-v4
 neighbor 2001:db8:100:2::2 remote-as 65002
 neighbor 2001:db8:100:2::2 description CE-B-S2-v6
 !
 address-family ipv4 unicast
  neighbor 172.16.2.6 activate
  neighbor 172.16.2.6 route-map RM-CUSTB-IN-V4 in
  neighbor 172.16.2.6 route-map RM-PERMIT-ALL out
  label vpn export auto
  rd vpn export 65000:202
  rt vpn both 65000:200
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:db8:100:2::2 activate
  neighbor 2001:db8:100:2::2 route-map RM-CUSTB-IN-V6 in
  neighbor 2001:db8:100:2::2 route-map RM-PERMIT-ALL out
  label vpn export auto
  rd vpn export 65000:202
  rt vpn both 65000:200
  export vpn
  import vpn
 exit-address-family
exit
!
end
