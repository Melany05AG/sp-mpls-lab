frr version 10.2.1
frr defaults traditional
hostname p1
log syslog informational
service integrated-vtysh-config
!
! ---------- Loopback (router-id, sesiones iBGP, transporte LDP) ----------
interface lo
 ip address 10.255.0.1/32
 ipv6 address 2001:db8:ffff::1/128
 ip router isis CORE
 ipv6 router isis CORE
 isis passive
exit
!
interface eth1
 description CORE -> P2
 ip address 10.0.0.0/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
interface eth2
 description CORE -> PE1
 ip address 10.0.0.3/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
interface eth3
 description CORE -> PE2
 ip address 10.0.0.7/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
interface eth4
 description CORE -> PE3
 ip address 10.0.0.11/31
 ip router isis CORE
 ipv6 router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
exit
!
! ---------- IGP: IS-IS L2, dual-stack (multi-topology IPv6) ----------
router isis CORE
 net 49.0001.0102.5500.0001.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
 log-adjacency-changes
exit
!
! ---------- MPLS: LDP sobre todos los enlaces del nucleo ----------
mpls ldp
 router-id 10.255.0.1
 !
 address-family ipv4
  discovery transport-address 10.255.0.1
  label local allocate host-routes
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
  interface eth3
  exit
  !
  interface eth4
  exit
  !
 exit-address-family
 !
exit
!
! ---------- BGP: route reflector para VPNv4, VPNv6 y EVPN ----------
! P1 solo lleva plano de control BGP; P2 es un nucleo libre de BGP.
router bgp 65000
 bgp router-id 10.255.0.1
 bgp cluster-id 10.255.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor PE peer-group
 neighbor PE remote-as 65000
 neighbor PE update-source lo
 neighbor PE description PE-clients
 neighbor 10.255.0.11 peer-group PE
 neighbor 10.255.0.12 peer-group PE
 neighbor 10.255.0.13 peer-group PE
 !
 address-family ipv4 vpn
  neighbor PE activate
  neighbor PE route-reflector-client
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor PE activate
  neighbor PE route-reflector-client
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor PE activate
  neighbor PE route-reflector-client
 exit-address-family
exit
!
end
