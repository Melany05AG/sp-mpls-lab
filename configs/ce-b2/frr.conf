frr version 10.2.1
frr defaults traditional
hostname ce-b2
log syslog informational
service integrated-vtysh-config
!
interface eth1
 description WAN -> PE (CUST-B)
 ip address 172.16.2.6/30
 ipv6 address 2001:db8:100:2::2/64
exit
!
interface eth2
 description LAN
 ip address 198.51.100.129/25
 ipv6 address 2001:db8:b2::1/64
exit
!
! Solo se anuncian los prefijos propios del sitio (nunca la LAN privada)
ip prefix-list PL-OWN-V4 seq 10 permit 198.51.100.128/25
ipv6 prefix-list PL-OWN-V6 seq 10 permit 2001:db8:b2::/64
!
route-map RM-OUT-V4 permit 10
 match ip address prefix-list PL-OWN-V4
exit
!
route-map RM-OUT-V6 permit 10
 match ipv6 address prefix-list PL-OWN-V6
exit
!
route-map RM-PERMIT-ALL permit 10
exit
!
router bgp 65002
 bgp router-id 198.51.100.129
 no bgp default ipv4-unicast
 neighbor 172.16.2.5 remote-as 65000
 neighbor 2001:db8:100:2::1 remote-as 65000
 !
 address-family ipv4 unicast
  network 198.51.100.128/25
  neighbor 172.16.2.5 activate
  neighbor 172.16.2.5 route-map RM-PERMIT-ALL in
  neighbor 172.16.2.5 route-map RM-OUT-V4 out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:b2::/64
  neighbor 2001:db8:100:2::1 activate
  neighbor 2001:db8:100:2::1 route-map RM-PERMIT-ALL in
  neighbor 2001:db8:100:2::1 route-map RM-OUT-V6 out
 exit-address-family
exit
!
end
