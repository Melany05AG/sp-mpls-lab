name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: |
          pip install yamllint pytest
          sudo apt-get update && sudo apt-get install -y shellcheck
      - name: YAML
        run: yamllint -d relaxed sp-lab.clab.yml .github/workflows
      - name: Python
        run: python -m py_compile automation/*.py tests/*.py && python -m pytest --collect-only -q
      - name: Shell
        run: shellcheck -s sh configs/*/setup.sh scripts/*.sh
